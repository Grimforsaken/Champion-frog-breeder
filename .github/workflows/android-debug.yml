name: Android Debug APK

on:
  push:
    branches: [apk-test]
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.3"
  EXPORT_NAME: "champion-frog-breeder-debug"

jobs:
  android-debug:
    name: Build Android Debug APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Godot CI paths
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p ~/.local/share/godot/export_templates/
          mkdir -p ~/.config/
          if [ -d /root/.config/godot ]; then
            rm -rf ~/.config/godot
            mv /root/.config/godot ~/.config/godot
          fi
          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ]; then
            rm -rf ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
            mv "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          fi
          godot --version

      - name: Import project and validate scripts
        shell: bash
        run: |
          set -euxo pipefail
          godot --headless --verbose --editor --quit

      - name: Export debug APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/android
          godot --headless --verbose --export-debug "Android Debug" "build/android/${EXPORT_NAME}.apk"
          test -s "build/android/${EXPORT_NAME}.apk"
          ls -lh build/android/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: champion-frog-breeder-debug-apk
          path: build/android/champion-frog-breeder-debug.apk
          if-no-files-found: error
          retention-days: 14
