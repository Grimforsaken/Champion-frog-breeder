name: Build Android Test APK

on:
  push:
    branches:
      - prototype-core
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    name: Android debug APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore staged lifecycle art
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p assets/lifecycle
          base64 -d build_assets/EXACT_froglet.b64 > assets/lifecycle/froglet_tank.webp
          test -s assets/lifecycle/froglet_tank.webp

          test -s assets/scenes/lab.webp
          test -s assets/scenes/shop.webp
          test -s assets/habitats/backyard_puddle.webp
          test -s assets/habitats/pond.webp
          test -s assets/home/table.webp
          test -s assets/frogs/regular_side_mask.webp
          test -s assets/frogs/regular_top_mask.webp
          test -s assets/frogs/bullfrog_top_mask.webp
          test -s assets/tank_items/water_dish.webp
          test -s assets/tank_items/bark_cave.webp
          test -s assets/tank_items/leaf_litter.webp
          test -s assets/tank_items/moss_mound.webp
          test -s assets/tank_items/rock_cluster.webp
          test -s assets/tank_items/broadleaf_plant.webp

      - name: Prepare Godot 4.3 Android toolchain
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates"
          if [ -d /root/.local/share/godot/export_templates/4.3.stable ]; then
            cp -a /root/.local/share/godot/export_templates/4.3.stable "$HOME/.local/share/godot/export_templates/4.3.stable"
          elif [ -d /root/.local/share/godot/templates/4.3.stable ]; then
            cp -a /root/.local/share/godot/templates/4.3.stable "$HOME/.local/share/godot/export_templates/4.3.stable"
          fi

          mkdir -p "$HOME/.config/godot"
          if [ -d /root/.config/godot ]; then
            cp -a /root/.config/godot/. "$HOME/.config/godot/" || true
          fi
          SETTINGS="$HOME/.config/godot/editor_settings-4.3.tres"
          touch "$SETTINGS"
          printf '\nexport/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"\n' >> "$SETTINGS"
          printf 'export/android/android_sdk_path = "%s"\n' "${ANDROID_HOME:-/usr/lib/android-sdk}" >> "$SETTINGS"

          base64 -d build_assets/debug_keystore.b64 > /tmp/champion-frog-debug.keystore
          keytool -list -keystore /tmp/champion-frog-debug.keystore -storepass android -alias androiddebugkey >/dev/null

          test -d "${ANDROID_HOME:-/usr/lib/android-sdk}"
          test -d "$HOME/.local/share/godot/export_templates/4.3.stable"
          test -s /tmp/champion-frog-debug.keystore

      - name: Import project and check GDScript and art
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path . --import --quit 2>&1 | tee godot-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script|ERR_FILE_CORRUPT|Error importing|Error loading image" godot-import.log; then
            echo "Godot reported a script or asset import error."
            exit 1
          fi

      - name: Run startup smoke test
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 3 2>&1 | tee godot-runtime.log
          if grep -E "SCRIPT ERROR|Invalid call|Invalid access|Attempt to call|Failed to load script" godot-runtime.log; then
            echo "Godot reported a runtime error during startup."
            exit 1
          fi

      - name: Verify interactive UI screens
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://src/ui_smoke_test.gd 2>&1 | tee ui-smoke.log
          grep -q "UI_SMOKE PASS" ui-smoke.log
          if grep -q "UI_SMOKE_FAIL" ui-smoke.log; then
            exit 1
          fi

      - name: Export debug APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /tmp/champion-frog-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euxo pipefail
          mkdir -p build/android
          godot --headless --path . --verbose --export-debug "Android" build/android/champion-frog-breeder-debug.apk
          test -s build/android/champion-frog-breeder-debug.apk
          ls -lh build/android/champion-frog-breeder-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: champion-frog-breeder-debug-apk
          path: build/android/champion-frog-breeder-debug.apk
          if-no-files-found: error
          retention-days: 14
